name: Concurrent
on: push
jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - name: first
        run: echo "first job" && sleep 1
  second:
    needs: first
    runs-on: ubuntu-latest
    steps:
      - name: second
        run: echo "second job"
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        n: [1, 2, 3]
    steps:
      - name: matrix step
        run: echo "matrix ${{ matrix.n }}" && sleep 1
